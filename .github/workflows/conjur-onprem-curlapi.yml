name: Retrieve secret from Conjur using curl

on:
  workflow_dispatch:

jobs:
  get-conjur-secret:
    runs-on: self-hosted # or ubuntu-latest

    steps:
      - name: Retrieve Conjur secret using API key auth
        shell: bash
        env:
          CONJUR_APPLIANCE_URL: ${{ secrets.CONJUR_APPLIANCE_URL }}
          CONJUR_ACCOUNT: ${{ secrets.CONJUR_ACCOUNT }}
          CONJUR_LOGIN: ${{ secrets.CONJUR_LOGIN }}
          CONJUR_API_KEY: ${{ secrets.CONJUR_API_KEY }}
          CONJUR_SECRET_ID: ${{ secrets.CONJUR_SECRET_ID }}
        run: |
          set -euo pipefail

          # Extra masking in case any value is accidentally echoed
          echo "::add-mask::$CONJUR_APPLIANCE_URL"
          echo "::add-mask::$CONJUR_ACCOUNT"
          echo "::add-mask::$CONJUR_LOGIN"
          echo "::add-mask::$CONJUR_API_KEY"
          echo "::add-mask::$CONJUR_SECRET_ID"

          ENCODED_LOGIN="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["CONJUR_LOGIN"], safe=""))')"
          ENCODED_SECRET_ID="$(python3 -c 'import urllib.parse, os; print(urllib.parse.quote(os.environ["CONJUR_SECRET_ID"], safe=""))')"

          TOKEN="$(curl -sS \
            --request POST \
            --header "Accept-Encoding: base64" \
            --data "$CONJUR_API_KEY" \
            "$CONJUR_APPLIANCE_URL/authn/$CONJUR_ACCOUNT/$ENCODED_LOGIN/authenticate")"

          echo "::add-mask::$TOKEN"

          SECRET_VALUE="$(curl -sS \
            --header "Authorization: Token token=\"$TOKEN\"" \
            "$CONJUR_APPLIANCE_URL/secrets/$CONJUR_ACCOUNT/variable/$ENCODED_SECRET_ID")"

          echo "::add-mask::$SECRET_VALUE"

          # Use the secret without printing it
          echo "Conjur secret retrieved successfully."
