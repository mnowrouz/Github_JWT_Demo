name: Retrieve secret from Conjur using curl

on:
  workflow_dispatch:

jobs:
  get-conjur-secret:
    runs-on: self-hosted

    steps:
      - name: Authenticate to Conjur and retrieve secret
        shell: bash
        env:
          CONJUR_APPLIANCE_URL: ${{ secrets.CONJUR_APPLIANCE_URL }}
          CONJUR_ACCOUNT: ${{ secrets.CONJUR_ACCOUNT }}
          CONJUR_LOGIN: ${{ secrets.CONJUR_LOGIN }}
          CONJUR_API_KEY: ${{ secrets.CONJUR_API_KEY }}
          CONJUR_SECRET_ID: ${{ secrets.CONJUR_SECRET_ID }}
        run: |
          set -euo pipefail
        
          clean() {
            printf '%s' "$1" | tr -d '\r\n' | sed 's/^ *//;s/ *$//'
          }
        
          CONJUR_APPLIANCE_URL="$(clean "$CONJUR_APPLIANCE_URL")"
          CONJUR_ACCOUNT="$(clean "$CONJUR_ACCOUNT")"
          CONJUR_LOGIN="$(clean "$CONJUR_LOGIN")"
          CONJUR_API_KEY="$(clean "$CONJUR_API_KEY")"
          CONJUR_SECRET_ID="$(clean "$CONJUR_SECRET_ID")"
        
          CONJUR_APPLIANCE_URL="${CONJUR_APPLIANCE_URL%/}"
        
          ENCODED_LOGIN="${CONJUR_LOGIN//\//%2F}"
          ENCODED_SECRET_ID="${CONJUR_SECRET_ID//\//%2F}"
        
          AUTH_URL="${CONJUR_APPLIANCE_URL}/authn/${CONJUR_ACCOUNT}/${ENCODED_LOGIN}/authenticate"
          SECRET_URL="${CONJUR_APPLIANCE_URL}/secrets/${CONJUR_ACCOUNT}/variable/${ENCODED_SECRET_ID}"
        
          echo "Authenticating to Conjur..."
        
          TOKEN="$(printf '%s' "$CONJUR_API_KEY" | curl -k -sS --fail-with-body \
            -X POST \
            -H "Accept-Encoding: base64" \
            --data-binary @- \
            "$AUTH_URL")"
        
          echo "::add-mask::$TOKEN"
        
          echo "Retrieving secret..."
        
          SECRET_VALUE="$(curl -k -sS --fail-with-body \
            -H "Authorization: Token token=\"${TOKEN}\"" \
            "$SECRET_URL")"
        
          echo "::add-mask::$SECRET_VALUE"
        
          echo "Secret retrieved successfully."
