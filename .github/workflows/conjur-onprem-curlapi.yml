name: Retrieve secret from Conjur using curl

on:
  workflow_dispatch:

jobs:
  get-conjur-secret:
    runs-on: self-hosted

    steps:
      - name: Authenticate to Conjur and retrieve secret
        shell: bash
        env:
          CONJUR_APPLIANCE_URL: ${{ secrets.CONJUR_APPLIANCE_URL }}
          CONJUR_ACCOUNT: ${{ secrets.CONJUR_ACCOUNT }}
          CONJUR_LOGIN: ${{ secrets.CONJUR_LOGIN }}
          CONJUR_API_KEY: ${{ secrets.CONJUR_API_KEY }}
          CONJUR_SECRET_ID: ${{ secrets.CONJUR_SECRET_ID }}

        run: |
          set -euo pipefail

          echo "::add-mask::$CONJUR_API_KEY"

          TOKEN=$(curl -s \
            -X POST \
            -H "Accept-Encoding: base64" \
            --data "$CONJUR_API_KEY" \
            "${CONJUR_APPLIANCE_URL}/authn/${CONJUR_ACCOUNT}/${CONJUR_LOGIN}/authenticate")

          echo "::add-mask::$TOKEN"

          SECRET_VALUE=$(curl -s \
            -H "Authorization: Token token=\"$TOKEN\"" \
            "${CONJUR_APPLIANCE_URL}/secrets/${CONJUR_ACCOUNT}/variable/${CONJUR_SECRET_ID}")

          echo "::add-mask::$SECRET_VALUE"

          echo "Secret retrieved successfully"

          # Example use:
          export DB_PASSWORD="$SECRET_VALUE"
